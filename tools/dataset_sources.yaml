# How the released dataset was built from the raw recordings (tools/build_dataset.py).
#
# The raw recordings do not all use the same ids for AGV and Unlabelled.
# The released files follow sim2real/labels.py: 6 = AGV, 7 = Unlabelled.
# The label_map of each source was determined from the geometry of the
# labelled points (the AGV is a compact ~0.7 m wide, ~1.3 m tall object on the
# floor; Unlabelled points are scattered) and checked visually.
#
#   raw convention                       label_map
#   6 = AGV,        no 7                 {}            (already correct)
#   7 = AGV,        6 = Unlabelled       {6: 7, 7: 6}  (swap)
#   6 = Unlabelled, no AGV in the scene  {6: 7}

source_root: /home/lidar/Thesis

sources:
  # ---- simulation (NVIDIA Isaac Sim) -------------------------------------
  # Rebuilt at full density from the raw Isaac output with the hand-corrected
  # labels (tools/isaac_to_npy.py).
  - name: sim/isaac_2023-05-02
    type: isaac
    raw: Isaac-SIM-synthetic-data/Tests/02052023
    path: "Tests/02052023/Down/SIMCorrect annotation/NPY-Downto11000"
    voxel: 0.02

  # ---- real, lab A -------------------------------------------------------
  - name: real/labA_NewLabelRealDown
    path: Tests/RealLAb/NewLabelingDownSample/1/Train
    pattern: '^NewLabelRealDown\d+\.npy$'
    label_map: {6: 7, 7: 6}

  # ---- real, lab B (Oct/Nov 2023) -----------------------------------------
  - name: real/labB_2023-10-22
    path: New_Real_Lab/Train
    pattern: '^(cut_merged_labelled|pointcloudLabel)\d+\.npy$'
    label_map: {}
  - name: real/labB_2023-10-31
    path: New_Real_Lab/Train
    pattern: '^\d+\.npy$'
    label_map: {6: 7}
  - name: real/labB_2023-11-01
    path: New_Real_Lab/Train
    pattern: '^0_\d+\.npy$'
    label_map: {6: 7}
  - name: real/labB_2023-11-10
    path: New_Real_Lab/Train
    pattern: '^10\.11\.2023_\d+\.npy$'
    label_map: {6: 7}

  # ---- real, lab C with demonstrator (20 Nov 2023) -------------------------
  - name: real/labC_2023-11-20
    path: New-Lab_demonstrator/merged1_2/npy_cut/correct_label/Train
    pattern: '^LabDemons.*\.npy$'
    label_map: {6: 7, 7: 6}
  - name: real/labC_2023-11-20
    path: New-Lab_demonstrator/merged1_2/npy_cut/correct_label/Test
    pattern: '^LabDemons.*\.npy$'
    label_map: {6: 7, 7: 6}

  # ---- real, fine-tuning environments ---------------------------------------
  # These folders mix recording dates, so frames are grouped by the date in
  # their file name (by_date). Exact duplicate files are dropped automatically.
  - name: real/labD
    path: New_Real_Lab/29.11.2023/Train
    by_date: true
    label_map: {6: 7}
  - name: real/labD
    path: New_Real_Lab/29.11.2023/Test
    by_date: true
    label_map: {6: 7}
  - name: real/labD
    path: New_Real_Lab/07.06.2024/NPY/Train
    by_date: true
    label_map: {6: 7}
  - name: real/labD
    path: New_Real_Lab/07.06.2024/NPY/Test
    by_date: true
    label_map: {6: 7}
  - name: real/labE
    path: NewDataLab2026/npy_new/Train
    by_date: true
    label_map: {6: 7}
  - name: real/labE
    path: NewDataLab2026/npy_new/Test
    by_date: true
    label_map: {6: 7}

  # ===== V1.1 additions =======================================================
  # More frames of the sessions above (their test/val folders and extra
  # corrected frames) and new sessions. `dedupe` skips frames that are already
  # in the dataset at another resolution or with an older labelling.

  # ---- simulation, October 2022 (Isaac Sim "Lab1" scene, no AGV) ------------
  - {name: sim/isaac_2022-10, path: Tests/Lab1/13102022/NPY1410, rename: ['^', 'a_'], label_map: {}, dedupe: true}
  - {name: sim/isaac_2022-10, path: Tests/Lab1/13102022/NPY, rename: ['^(beforeshaffel)?', 'b_'], label_map: {}, dedupe: true}
  - {name: sim/isaac_2022-10, path: Tests/Lab1/NPY/2, rename: ['^', 'c_'], label_map: {}, dedupe: true}
  - {name: sim/isaac_2022-10, path: Tests/Lab1/NPY/1, rename: ['^', 'd_'], label_map: {}, dedupe: true}

  # ---- real, lab A ------------------------------------------------------------
  - {name: real/labA_NewLabelRealDown, path: Tests/RealLAb/NewLabelingDownSample/1/Test, pattern: '^NewLabelRealDown\d+\.npy$', label_map: {6: 7, 7: 6}, dedupe: true}

  # ---- real, lab B ------------------------------------------------------------
  - {name: real/labB_2023-10-22, path: "22.10.2023/merged/test/cut_point/coloredLabelled_cut/Correct_Label/Dataset/Train", pattern: '^(cut_merged_labelled|pointcloudLabel)\d+\.npy$', label_map: {}, dedupe: true}
  - {name: real/labB_2023-10-22, path: "22.10.2023/merged/test/cut_point/coloredLabelled_cut/Correct_Label/Dataset/Test", pattern: '^(cut_merged_labelled|pointcloudLabel)\d+\.npy$', label_map: {}, dedupe: true}
  - {name: real/labB_2023-10-22, path: "22.10.2023/merged/test/cut_point/coloredLabelled_cut/Correct_Label", pattern: '^Predicted_Unlabelled_to_lAbelled', label_map: {}, rename: ['^Predicted_Unlabelled_to_lAbelled', ''], dedupe: true}
  - {name: real/labB_2023-10-31, path: New_Real_Lab/correct_label_31.10.2023/npy, pattern: '^\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-01, path: New_Real_Lab/correct_label_01.11.2023/npy, pattern: '^0_\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-10, path: New_Real_Lab/correct_label_10.11.2023/npy, pattern: '^10\.11\.2023_\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-10-22, path: New_Real_Lab/Test, pattern: '^(cut_merged_labelled|pointcloudLabel)\d+\.npy$', label_map: {}, dedupe: true}
  - {name: real/labB_2023-10-31, path: New_Real_Lab/Test, pattern: '^\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-01, path: New_Real_Lab/Test, pattern: '^0_\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-10, path: New_Real_Lab/Test, pattern: '^10\.11\.2023_\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-10-22, path: New_Real_Lab/val, pattern: '^(cut_merged_labelled|pointcloudLabel)\d+\.npy$', label_map: {}, dedupe: true}
  - {name: real/labB_2023-10-31, path: New_Real_Lab/val, pattern: '^\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-01, path: New_Real_Lab/val, pattern: '^0_\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-10, path: New_Real_Lab/val, pattern: '^10\.11\.2023_\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-10-22, path: New_Real_Lab/Test2_less, pattern: '^(cut_merged_labelled|pointcloudLabel)\d+\.npy$', label_map: {}, dedupe: true}
  - {name: real/labB_2023-10-31, path: New_Real_Lab/Test2_less, pattern: '^\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-01, path: New_Real_Lab/Test2_less, pattern: '^0_\d+\.npy$', label_map: {6: 7}, dedupe: true}
  - {name: real/labB_2023-11-10, path: New_Real_Lab/Test2_less, pattern: '^10\.11\.2023_\d+\.npy$', label_map: {6: 7}, dedupe: true}

  # ---- real, lab D and lab E --------------------------------------------------
  - {name: real/labD, path: New_Real_Lab/07.06.2024/NPY/Val, by_date: true, label_map: {6: 7}, dedupe: true}
  - {name: real/labE, path: NewDataLab2026/npy_new/val, by_date: true, label_map: {6: 7}, dedupe: true}
  - {name: real/labE, path: NewDataLab2026/npy, by_date: true, label_map: {6: 7}, dedupe: true}
  - {name: real/labE_2026-08-27, path: NewDataLab2026/npy/Train, label_map: {6: 7}, dedupe: true}
  - {name: real/labE_2026-08-27, path: NewDataLab2026/npy/Test, label_map: {6: 7}, dedupe: true}

  # ---- real, demonstrator installation (25.11.2023) --------------------------
  - {name: real/demo, path: Demo_2023-11/Train, rename: ['^[A-Z]+', ''], by_date: true, label_map: {6: 7}, source_label: demo recording, dedupe: true}
  - {name: real/demo, path: Demo_2023-11/Val, rename: ['^[A-Z]+', ''], by_date: true, label_map: {6: 7}, source_label: demo recording, dedupe: true}
  - {name: real/demo, path: Demo_2023-11/Test, rename: ['^[A-Z]+', ''], by_date: true, label_map: {6: 7}, source_label: demo recording, dedupe: true}

  # ---- real, lab A: COVERED scenes ---------------------------------------------
  # COVERED (5 classes + Unlabeled) recorded in lab A; demonstrator and tables
  # are taken from the relabelled lab-A frames of the same room.
  - {name: real/labA_covered_s1, type: covered, path: COVERED/Scenario1/npy_label_data, reference: real/labA_NewLabelRealDown, source_label: COVERED scenario 1, dedupe: true}
  - {name: real/labA_covered_s2, type: covered, path: COVERED/Scenario2/npy_label_data, reference: real/labA_NewLabelRealDown, source_label: COVERED scenario 2, dedupe: true}
  - {name: real/labA_covered_s3, type: covered, path: COVERED/Scenario3/npy_label_data, reference: real/labA_NewLabelRealDown, source_label: COVERED scenario 3, dedupe: true}
  - {name: real/labA_covered_s4, type: covered, path: COVERED/Scenario4/npy_label_data, reference: real/labA_NewLabelRealDown, source_label: COVERED scenario 4, dedupe: true}
