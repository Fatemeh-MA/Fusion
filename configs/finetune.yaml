# Step 2 of the paper: adapt to a real environment with a few labelled frames.
#
# Default: fine-tune the whole network at a low learning rate. To train the
# segmentation head only (conv8, conv9) set
#   finetune.freeze_encoders=true finetune.freeze_bn=true train.optimizer.lr=1.13e-3
# Fine-tuning can be chained (sim -> lab A -> lab B ...); the normalization
# (mode, scale, voxel) always comes from `init_from`.

data:
  root: data
  train_split: splits/labD_train.txt
  val_split: splits/labD_val.txt
  test_split: splits/labD_test.txt
  num_points: 10500              # max points per training sample
  voxel_size: 0.048              # taken from the checkpoint; listed for reference

model:
  name: dualstream
  args:
    num_classes: 8
    k: 40
    dropout: 0.35

finetune:
  init_from: outputs/sim/best.pth     # previous stage
  reset_head: false                   # true: new random conv9
  freeze_encoders: false              # true: train conv8/conv9 only
  freeze_bn: false                    # true: keep the encoders' BatchNorm statistics

augmentation:
  rotate_z: [0, 360]
  flip: true
  scale: [0.9, 1.1]
  shift_xy: 0.5
  jitter_std: 0.01
  jitter_clip: 0.05

train:
  epochs: 50
  batch_size: 1                       # real frames are used whole, not padded
  num_workers: 4
  seed: 1
  ignore_index: null                  # Unlabelled is learnt as a class (clutter must go somewhere)
  score_ignore_index: 7               # ... but it is not counted in mIoU / accuracy
  class_weights: [0.14, 0.15, 0.12, 0.15, 0.12, 0.12, 0.16, 0.07]
  optimizer: {name: adam, lr: 1.0e-4, weight_decay: 5.649e-4}
  scheduler: {name: cosine, min_lr: 1.0e-5}
  grad_clip: 10.0
  val_every: 1

output_dir: outputs/finetune_labD
